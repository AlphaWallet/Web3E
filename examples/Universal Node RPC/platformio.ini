; Example: signed read-only RPC via universal-node
; Target: esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; Larger app partition — signed-RPC client + WiFi TLS push default 1.3MB close to full
board_build.partitions = huge_app.csv

lib_deps =
    Web3E
