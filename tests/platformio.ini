;PlatformIO Test Configuration for Web3E
;
; OFFLINE TESTS (default - no credentials needed):
;   Compile only (CI):     pio test -e esp32dev --without-uploading --without-testing
;   Run on device:         pio test -e esp32dev --upload-port COM15 --test-port COM15
;
; NETWORK TESTS (requires credentials):
;   1. Copy test_config.ini.example to test_config.ini
;   2. Edit test_config.ini with your Wi-Fi and RPC credentials (never committed)
;   3. Run:                pio test -e esp32dev_network --upload-port COM15 --test-port COM15
;
; Or pass credentials via environment variables:
;   set WIFI_SSID=YourSSID && set WIFI_PASS=YourPassword && set RPC_URL=https://... && pio test -e esp32dev_network ...

[platformio]
test_dir = .

[env:esp32dev]
; Default environment: offline tests only (no Wi-Fi/RPC required)
platform = espressif32
board = esp32dev
framework = arduino

test_framework = unity
monitor_speed = 115200
test_speed = 115200

build_flags =
    -DTEST_BUILD
    -DOFFLINE_ONLY

; Ignore network test files when OFFLINE_ONLY is defined
test_ignore = test_network_*

; Web3E library from parent directory
lib_deps =
    symlink://../

lib_ldf_mode = deep

; Exclude Unity example tests from scanning
test_filter = test_*
lib_compat_mode = off

[env:esp32dev_network]
; Network tests environment: includes Wi-Fi and RPC tests
; Credentials loaded from test_config.ini (untracked) or environment variables
platform = espressif32
board = esp32dev
framework = arduino

test_framework = unity
monitor_speed = 115200
test_speed = 115200

build_flags =
    -DTEST_BUILD
    -DENABLE_NETWORK_TESTS
    -DARDUINO_LOOP_STACK_SIZE=16384

; Web3E library from parent directory
lib_deps =
    symlink://../

; Run script to load credentials from test_config.ini if it exists
extra_scripts = pre:load_test_config.py

lib_ldf_mode = deep

; Exclude Unity example tests from scanning
test_filter = test_*
lib_compat_mode = off
