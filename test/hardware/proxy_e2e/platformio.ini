[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_ldf_mode = deep

; Depend on Web3E from parent directory
lib_deps = 
    symlink://../../../

build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DPROXY_HOST=\"scriptproxy.percolate.one\"
    -DPROXY_PORT=8082
    '-DFW_VERSION="e2e-${PIOENV}"'

; Optional: Get git SHA for firmware version
extra_scripts = pre:git_version.py
