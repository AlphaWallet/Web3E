;PlatformIO Project Configuration File
;
; Test consumer project to verify Web3E can be consumed from git URL
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; Consume Web3E from the git repository
; In production, consumers should pin to a specific tag like:
; https://github.com/AlphaWallet/Web3E.git#v1.45
lib_deps =
    file://..
